name: Publish Snow Gesh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download website
        run: |
          VERSION="V77"
          ARCHIVE="https://filebin.net/snow-gesh-v77-photos/snow-gesh-v77.tar.gz"
          CHECKSUM="https://filebin.net/snow-gesh-v77-photos/site.sha256"
          if [ -f release.json ]; then
            VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
            ARCHIVE=$(python3 -c 'import json; print(json.load(open("release.json"))["archive"])')
            CHECKSUM=$(python3 -c 'import json; print(json.load(open("release.json"))["checksum"])')
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          curl --retry 3 -fsSL --max-time 1500 "$ARCHIVE" -o /tmp/site.tar.gz
          curl --retry 3 -fsSL --max-time 60 "$CHECKSUM" -o /tmp/site.sha256
          sha256sum -c /tmp/site.sha256
          tar -xzf /tmp/site.tar.gz
      - name: Save website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish Snow Gesh $RELEASE_VERSION"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          rm -rf site
          mkdir site
          touch .nojekyll
          cp -r index.html assets images fonts media icon-192.png icon-512.png favicon.svg manifest.webmanifest sw.js .nojekyll site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
